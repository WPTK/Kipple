name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so the exact tagged commit is tested again before an image is built.
  workflow_call:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.1
  GOSEC_VERSION: v2.29.0
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's
  # gitleaks_<version>_checksums.txt. Update both together when bumping.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # Job-level so the step-level `if` below can see it (a step's own env is not in scope for its `if`).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      # web/dist only has the committed .gitkeep placeholder here; the Go
      # build and tests must succeed against that (see web/embed.go).
      - run: go vet ./...
      # Coverage is visibility only (SQA plan): printed per package and uploaded to Codecov, not a gate.
      # -race requires -covermode=atomic.
      - run: go test -race -shuffle=on -timeout 15m -covermode=atomic -coverprofile=coverage.out ./...

      - run: go tool cover -func=coverage.out | tail -n 1

      # The thumbnail memory-limit tests skip under -race (the detector's own allocations break the measurement), so
      # without this step no CI run would execute them.
      - name: go test internal/imgproxy (no -race)
        run: go test -count=1 -shuffle=on -timeout 10m ./internal/imgproxy

      # Skipped without the CODECOV_TOKEN secret (fork PRs, or before it is set); never fails the build.
      - name: Upload Go coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Shared with the weekly audit (audit.yml).
      - uses: ./.github/actions/audit-govulncheck # zizmor: ignore[self-repository]

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

      # Advisory pass: everything stays visible in the log, never fails.
      - name: gosec (all findings, advisory)
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -quiet ./... || true

      # Gate: only HIGH severity with HIGH confidence fails the job.
      - name: gosec (gate)
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -quiet -severity high -confidence high ./...

      # Binary, not gitleaks-action: the action needs a paid license key for
      # organization repos.
      - name: gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  web:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Changelog fragments (changes/): names and bodies valid, CHANGELOG.md [Unreleased] untouched, and the tooling's own tests.
      - run: node ../scripts/changelog.mjs check
      - run: node --test ../scripts/changelog.test.mjs
      # The release workflow's tag rules (floating tags, tag shape, base image digest) live in a script with its own test.
      - run: bash ../scripts/release-tags.test.sh
      # Go and Node versions agree across Dockerfile, go.mod, ci.yml and ci-local.ps1 (one Dependabot bump must not split them).
      - run: node --test ../scripts/toolchain.test.mjs
      # The weekly audit's issue open/update/close decisions (audit.yml), against a fake gh.
      - run: node --test ../scripts/audit-report.test.mjs
      # --ignore-scripts: no dependency install script runs; the build and tests call their tools directly.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Runs the whole suite (a failing test fails the step) and prints a coverage summary; no threshold gate (SQA plan).
      - run: npm run test:coverage

      - name: Upload web coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
      - run: npm run build
      - run: npm run contrast
      # Shared with the weekly audit (audit.yml).
      - uses: ./.github/actions/audit-npm # zizmor: ignore[self-repository]
      # Registry signatures and provenance of what was installed (a different check from the advisory audit above).
      # A registry hiccup here is fixed by re-running the job.
      - run: npm audit signatures

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, for git describe

      # Build and scan are shared with the weekly audit (audit.yml). Local actions are accepted by zizmor inline.
      - uses: ./.github/actions/build-image # zizmor: ignore[self-repository]
        with:
          tag: kipple:ci
          cache-scope: ci

      - uses: ./.github/actions/audit-image # zizmor: ignore[self-repository]
        with:
          image-ref: kipple:ci
