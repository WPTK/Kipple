name: zizmor

# Static analysis of the workflows themselves (injection, over-broad permissions, unpinned actions, credential
# persistence). It fails the PR when it finds something, and it is checked under the "CI green on the exact head" rule.
# Accepted findings carry an inline `# zizmor: ignore[rule]` on the line, with the reason in a comment beside it. SARIF upload is off so it needs no
# security-events permission.
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # zizmor itself is pinned too, so a new release never changes the result of an unrelated PR; bump on purpose.
          version: 1.30.1
          inputs: .github
          advanced-security: false
