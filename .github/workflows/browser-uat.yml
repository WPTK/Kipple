name: Browser UAT

# The scripted browser checks (web/uat, docs/maintainers/uat-plan.md Suite 1) against a seeded throwaway instance on
# loopback, in real browsers: the whole suite plus every flow listed in web/uat/flows.json (a flow file that is neither
# listed nor excluded fails the first step). Unit tests cannot see what a browser sends or what a click really does;
# this can.
#
# Its own workflow, not a job of ci.yml: release.yml calls ci.yml, and a slow or flaky browser run must not hold up a
# release or the go, web, security and docker checks. It is not a required check yet (do not add it to the branch
# protection until it has run green for a few weeks), and scripts/maintainers/pr-ready.ps1 prints its result without
# blocking on it (its AdvisoryChecks list: take "Browser UAT" off when the check becomes required).
#
# No outside network: the seed's feeds are served by web/scripts/fixture-feeds.mjs on loopback. The prose-only skip is
# the one ci.yml uses (scripts/ci-changes.sh against the base commit's rules, fail-open): the job still reports, with
# its steps skipped. A pull request runs Chromium alone when it changes only docs, changelog entries, the tools/ module or
# test files (ci-changes.sh --engines); WebKit and Firefox exist for what another engine does with a server response, so
# any other change, and every push to main and manual run, runs all three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request (a newer push supersedes the old run). Every other run gets a group of its own: a group
  # holds one pending run, so a shared one would drop a queued commit on main, and "CI green on the exact head" needs
  # each merged commit to keep its own result.
  group: browser-uat-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uat:
    name: Browser UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Ports of their own, never Kipple's default, so nothing else on the runner can answer for them.
      KIPPLE_DEV_PORT: "1991"
      KIPPLE_UAT_URL: http://127.0.0.1:1991
      KIPPLE_SEED_FEEDS_URL: http://127.0.0.1:1994
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # on a pull request HEAD is the merge commit and HEAD^1 is the base tip

      # Same rule as ci.yml's `changes` job: the classification comes from the base commit, and anything unexpected runs.
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RULES: ${{ runner.temp }}/base-rules
        run: |
          code=true
          engines=all
          if [ "$EVENT_NAME" = pull_request ]; then
            if mkdir -p "$RULES" && git show HEAD^1:scripts/ci-changes.sh > "$RULES/ci-changes.sh" && git show HEAD^1:scripts/ci-prose.txt > "$RULES/ci-prose.txt" && out="$(bash "$RULES/ci-changes.sh" "$EVENT_NAME")"; then
              if [ "$out" = false ]; then code=false; fi
              # Chromium alone only when the rules say no browser can receive anything different (scripts/ci-changes.sh
              # --engines); a base without that mode prints something else, which is all three engines.
              if [ "$(bash "$RULES/ci-changes.sh" --engines "$EVENT_NAME")" = chromium ]; then engines=chromium; fi
            else
              echo "::warning::the base commit has no usable scripts/ci-changes.sh; running the browser checks"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "code=$code engines=$engines"

      - if: steps.gate.outputs.code != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - if: steps.gate.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A flow file nobody listed would never run: fail before anything is built.
      - name: Every flow is listed or excluded
        if: steps.gate.outputs.code != 'false'
        run: node web/uat/all.mjs --check

      - name: Install the web dependencies
        id: deps
        if: steps.gate.outputs.code != 'false'
        working-directory: web
        run: |
          npm ci --ignore-scripts
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser builds are fixed by the Playwright version, so a cache keyed on it and the engine set saves the
      # download. The system libraries still come from apt below (--with-deps), which skips browsers already present.
      - if: steps.gate.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.deps.outputs.playwright }}-${{ steps.gate.outputs.engines }}

      # The system libraries (--with-deps) come from apt, and the Azure mirror sometimes stalls for minutes between
      # packages. So: the downloaded .deb files are cached (a warm run downloads nothing), a stalled connection is
      # dropped and retried within seconds, and the step has its own budget so a stall cannot eat the job's 45 minutes.
      # The cache is restored and saved by separate steps (same pinned commit as actions/cache) so the save can run
      # after a failed install: what was downloaded before the stall is kept for the next attempt. Each run saves under
      # its own key, restores the newest one for the same Playwright version and engines, and saves only when it fetched
      # something new.
      - name: Restore the downloaded system packages
        if: steps.gate.outputs.code != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.deps.outputs.playwright }}-${{ steps.gate.outputs.engines }}-${{ github.run_id }}
          restore-keys: |
            apt-debs-${{ runner.os }}-${{ steps.deps.outputs.playwright }}-${{ steps.gate.outputs.engines }}-

      - name: Install the browsers
        id: browsers
        if: steps.gate.outputs.code != 'false'
        timeout-minutes: 15
        working-directory: web
        env:
          ENGINES: ${{ steps.gate.outputs.engines == 'all' && 'chromium webkit firefox' || 'chromium' }}
        run: |
          mkdir -p ~/apt-debs
          echo "before=$(find ~/apt-debs -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
          # Drop a stalled connection after 20 s and try again, rather than waiting minutes on it.
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # shellcheck disable=SC2086 # one engine name per word
          npx playwright install --with-deps $ENGINES

      # Runs after a failed or timed-out install too. An empty "before" means the install never started: nothing to save.
      - name: Collect the downloaded system packages
        id: debs
        if: steps.gate.outputs.code != 'false' && always()
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
          before='${{ steps.browsers.outputs.before }}'
          now="$(find ~/apt-debs -name '*.deb' | wc -l)"
          if [ -n "$before" ] && [ "$now" -gt "$before" ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the downloaded system packages
        if: steps.gate.outputs.code != 'false' && always() && steps.debs.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.deps.outputs.playwright }}-${{ steps.gate.outputs.engines }}-${{ github.run_id }}

      # `npm run seed` builds web/dist when it is missing, builds Kipple, starts it and adds the fixture feeds.
      - name: Start the fixture feeds and a seeded instance on loopback
        if: steps.gate.outputs.code != 'false'
        working-directory: web
        run: |
          nohup node scripts/fixture-feeds.mjs --port 1994 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          nohup npm run seed > "$RUNNER_TEMP/seed.log" 2>&1 &
          seed=$!
          for _ in $(seq 1 300); do
            if ! kill -0 "$seed" 2>/dev/null; then
              echo "::error::the seed stopped before the instance was ready; its log ends:"
              tail -n 40 "$RUNNER_TEMP/seed.log"
              exit 1
            fi
            if curl -fsS "$KIPPLE_UAT_URL/healthz" > /dev/null 2>&1 && grep -q "Kipple is running" "$RUNNER_TEMP/seed.log"; then break; fi
            sleep 2
          done
          if ! grep -q "Kipple is running" "$RUNNER_TEMP/seed.log"; then
            echo "::error::the instance was not ready after 10 minutes; the seed log ends:"
            tail -n 40 "$RUNNER_TEMP/seed.log"
            exit 1
          fi
          node uat/wait-ready.mjs --seconds 120

      - name: Every flow (Chromium)
        if: steps.gate.outputs.code != 'false' && !cancelled()
        working-directory: web
        run: node uat/all.mjs --engine chromium

      # Playwright's WebKit is the WebKit engine, not Safari, but it sends the fetch metadata and download behaviour
      # that Chromium does not, which is where the saved-error-as-a-file bug showed.
      - name: Flows (WebKit)
        if: steps.gate.outputs.code != 'false' && steps.gate.outputs.engines == 'all' && !cancelled()
        working-directory: web
        run: node uat/all.mjs --engine webkit

      # Firefox has no static routing API in its service workers, so it keeps the worker's fetch handler for writes;
      # this runs the reading-time flow there to prove the beacon still gets through.
      - name: Flows (Firefox)
        if: steps.gate.outputs.code != 'false' && steps.gate.outputs.engines == 'all' && !cancelled()
        working-directory: web
        run: node uat/all.mjs --engine firefox

      - name: Keep the reports of a failed run
        if: steps.gate.outputs.code != 'false' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-uat
          path: |
            web/uat/results
            ${{ runner.temp }}/seed.log
            ${{ runner.temp }}/fixture.log
          if-no-files-found: ignore
          retention-days: 7
