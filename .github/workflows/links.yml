name: links

# Fails only on genuinely broken links (scripts/check-links.mjs, settings in scripts/check-links.json). A page that refuses
# this runner but is live in the Internet Archive is reported as blocked, not failed. A pull request checks the Markdown
# files it changes; the weekly run checks all of them, so a link that dies later is found without a doc change.
on:
  pull_request:
    paths: ["**/*.md", "scripts/check-links.*"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: node --test scripts/check-links.test.mjs

      # A pull request checks the *.md files it changes (or all of them when the checker itself changed); every other
      # run checks them all. The base ref goes through the environment, never into the script text.
      - name: Check links
        shell: bash # adds pipefail, so a failing check is not hidden by tee
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=()
          if [ "$EVENT" = "pull_request" ]; then
            if git diff --name-only origin/"$BASE_REF"...HEAD | grep -q '^scripts/check-links\.'; then
              : # the checker or its settings changed: check everything
            else
              mapfile -t files < <(git diff --name-only --diff-filter=d origin/"$BASE_REF"...HEAD -- '*.md')
              if [ "${#files[@]}" -eq 0 ]; then echo "no changed *.md"; exit 0; fi
            fi
          fi
          node scripts/check-links.mjs "${files[@]}" | tee "$RUNNER_TEMP/links.out"

      # Runs even when the check failed, so a weekly failure shows on the run page and not only in the log.
      - name: Summarise
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/links.out" ]; then
            { echo '### Link check'; echo '```'; cat "$RUNNER_TEMP/links.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
