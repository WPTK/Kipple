name: Fuzz

# Weekly mutation fuzzing of every Go fuzz target, so a bug is found between releases instead of only at the manual
# pre-release run (docs/maintainers/RELEASING.md, step 2). The seed corpus already runs as ordinary unit tests in ci.yml; this adds
# the mutation phase. It runs the same script as the manual step (scripts/fuzz.ps1, PowerShell 7 is on the runner),
# so there is one list of targets and one failure rule. A scheduled run only starts from the default branch.
#
# Two tiers: the merge-blocking one is ci.yml (every committed and f.Add seed runs as an ordinary test under -race, on
# every pull request); this is the deep one. Its targets are split over the matrix's runners (same total compute, a
# fraction of the wall time), and each target restores the previous run's mutation corpus, so a week's coverage builds on the last
# instead of starting cold. A failing target no longer hides the ones after it.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # the prune step deletes superseded corpus caches
    # A normal run takes about ten minutes; the cap is for a manual run with a long `seconds` (about eleven targets per shard).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Contiguous 1..N: the script is given "<shard>/<number of shards>", so a gap would leave a slice of targets unrun.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Go keeps the interesting inputs a fuzz run finds in "go env GOCACHE"/fuzz/<package>/<target>. Each target's directory is
      # cached under its own key (fuzz-corpus-<package>-<target>-<run id>), so a target that moves to another shard when the
      # target list changes still restores its corpus. A step cannot loop, so there is one restore and one save step per
      # slot (12; the plan fails if a shard needs more) and a slot without a target skips. setup-go caches the whole GOCACHE
      # under a go.sum key and saves it once; these restores run after it, so the newer corpus wins.
      - id: plan
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: scripts/fuzz-cache.ps1 -Action Plan -ShardSpec $env:SHARD

      - id: restore1
        if: ${{ steps.plan.outputs.key1 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path1 }}
          key: ${{ steps.plan.outputs.key1 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key1 }}
      - id: restore2
        if: ${{ steps.plan.outputs.key2 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path2 }}
          key: ${{ steps.plan.outputs.key2 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key2 }}
      - id: restore3
        if: ${{ steps.plan.outputs.key3 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path3 }}
          key: ${{ steps.plan.outputs.key3 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key3 }}
      - id: restore4
        if: ${{ steps.plan.outputs.key4 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path4 }}
          key: ${{ steps.plan.outputs.key4 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key4 }}
      - id: restore5
        if: ${{ steps.plan.outputs.key5 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path5 }}
          key: ${{ steps.plan.outputs.key5 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key5 }}
      - id: restore6
        if: ${{ steps.plan.outputs.key6 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path6 }}
          key: ${{ steps.plan.outputs.key6 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key6 }}
      - id: restore7
        if: ${{ steps.plan.outputs.key7 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path7 }}
          key: ${{ steps.plan.outputs.key7 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key7 }}
      - id: restore8
        if: ${{ steps.plan.outputs.key8 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path8 }}
          key: ${{ steps.plan.outputs.key8 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key8 }}
      - id: restore9
        if: ${{ steps.plan.outputs.key9 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path9 }}
          key: ${{ steps.plan.outputs.key9 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key9 }}
      - id: restore10
        if: ${{ steps.plan.outputs.key10 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path10 }}
          key: ${{ steps.plan.outputs.key10 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key10 }}
      - id: restore11
        if: ${{ steps.plan.outputs.key11 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path11 }}
          key: ${{ steps.plan.outputs.key11 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key11 }}
      - id: restore12
        if: ${{ steps.plan.outputs.key12 != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path12 }}
          key: ${{ steps.plan.outputs.key12 }}${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.key12 }}

      # web/dist holds only the committed placeholder, which is all the Go packages need (see web/embed.go).
      - name: Fuzz this shard's targets
        shell: pwsh
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: scripts/fuzz.ps1 -Seconds ([int]$env:SECONDS_PER_TARGET) -Shard $env:SHARD -ContinueOnFailure

      # Save each target's grown corpus even when a target failed (the other targets' coverage is still worth keeping). A
      # corpus over 10 MiB is not saved (the previous, smaller one stays in the cache).
      - id: cap
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/fuzz-cache.ps1 -Action Cap

      - if: ${{ !cancelled() && steps.cap.outputs.save1 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path1 }}
          key: ${{ steps.plan.outputs.key1 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save2 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path2 }}
          key: ${{ steps.plan.outputs.key2 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save3 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path3 }}
          key: ${{ steps.plan.outputs.key3 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save4 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path4 }}
          key: ${{ steps.plan.outputs.key4 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save5 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path5 }}
          key: ${{ steps.plan.outputs.key5 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save6 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path6 }}
          key: ${{ steps.plan.outputs.key6 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save7 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path7 }}
          key: ${{ steps.plan.outputs.key7 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save8 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path8 }}
          key: ${{ steps.plan.outputs.key8 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save9 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path9 }}
          key: ${{ steps.plan.outputs.key9 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save10 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path10 }}
          key: ${{ steps.plan.outputs.key10 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save11 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path11 }}
          key: ${{ steps.plan.outputs.key11 }}${{ github.run_id }}
      - if: ${{ !cancelled() && steps.cap.outputs.save12 == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.path12 }}
          key: ${{ steps.plan.outputs.key12 }}${{ github.run_id }}

      # Keep only the newest key per target, so the repository holds one corpus per target (the cache quota is 10 GB for
      # the whole repository, shared with the build and module caches).
      - if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fuzz-cache.ps1 -Action Prune

      # A failing input is written next to the package as an untracked file; keep it so it can be committed as a
      # regression seed once the bug is fixed.
      - name: Collect failing inputs
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | tee failing-inputs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failing-fuzz-inputs-${{ matrix.shard }}
          path: |
            failing-inputs.txt
            **/testdata/fuzz/**
          if-no-files-found: warn
