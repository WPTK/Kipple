name: Fuzz

# Weekly mutation fuzzing of every Go fuzz target, so a bug is found between releases instead of only at the manual
# pre-release run (docs/maintainers/RELEASING.md, step 2). The seed corpus already runs as ordinary unit tests in ci.yml; this adds
# the mutation phase. It runs the same script as the manual step (scripts/fuzz.ps1, PowerShell 7 is on the runner),
# so there is one list of targets and one failure rule. A scheduled run only starts from the default branch.
#
# Two tiers: the merge-blocking one is ci.yml (every committed and f.Add seed runs as an ordinary test under -race, on
# every pull request); this is the deep one. Its targets are split over the matrix's runners (same total compute, a
# fraction of the wall time), and each runner restores the previous run's mutation corpus, so a week's coverage builds on the last
# instead of starting cold. A failing target no longer hides the ones after it.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A normal run takes about ten minutes; the cap is for a manual run with a long `seconds` (about eight targets per shard).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Contiguous 1..N: the script is given "<shard>/<number of shards>", so a gap would leave a slice of targets unrun.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Go keeps the interesting inputs a fuzz run finds in "go env GOCACHE"/fuzz. Restore the newest corpus of this shard and
      # save the grown one below even when a target failed (the other targets' coverage is still worth keeping). setup-go
      # caches the same directory under a go.sum key and saves it once; this restore runs after it, so the newer corpus wins.
      - id: fuzzdir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-corpus-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.shard }}-

      # web/dist holds only the committed placeholder, which is all the Go packages need (see web/embed.go).
      - name: Fuzz this shard's targets
        shell: pwsh
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: scripts/fuzz.ps1 -Seconds ([int]$env:SECONDS_PER_TARGET) -Shard $env:SHARD -ContinueOnFailure

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-corpus-${{ matrix.shard }}-${{ github.run_id }}

      # A failing input is written next to the package as an untracked file; keep it so it can be committed as a
      # regression seed once the bug is fixed.
      - name: Collect failing inputs
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | tee failing-inputs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failing-fuzz-inputs-${{ matrix.shard }}
          path: |
            failing-inputs.txt
            **/testdata/fuzz/**
          if-no-files-found: warn
