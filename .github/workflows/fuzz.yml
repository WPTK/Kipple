name: Fuzz

# Weekly mutation fuzzing of every Go fuzz target, so a bug is found between releases instead of only at the manual
# pre-release run (docs/maintainers/RELEASING.md, step 2). The seed corpus already runs as ordinary unit tests in ci.yml; this adds
# the mutation phase. It runs the same script as the manual step (scripts/fuzz.ps1, PowerShell 7 is on the runner),
# so there is one list of targets and one failure rule. A scheduled run only starts from the default branch.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # web/dist holds only the committed placeholder, which is all the Go packages need (see web/embed.go).
      - name: Fuzz every target
        shell: pwsh
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: scripts/fuzz.ps1 -Seconds ([int]$env:SECONDS_PER_TARGET)

      # A failing input is written next to the package as an untracked file; keep it so it can be committed as a
      # regression seed once the bug is fixed.
      - name: Collect failing inputs
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | tee failing-inputs.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failing-fuzz-inputs
          path: |
            failing-inputs.txt
            **/testdata/fuzz/**
          if-no-files-found: warn
