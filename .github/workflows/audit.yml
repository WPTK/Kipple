name: Weekly audit

# A new advisory against a dependency or base image we already ship is invisible until the next commit triggers CI.
# This runs the same three audits CI runs (the composite actions in .github/actions/audit-*) every Monday against
# main, and keeps ONE tracking issue in step with the result: opened or updated while something fails, closed by the
# first clean run, left alone when nothing changed (scripts/audit-report.mjs). It never opens a PR or pushes.
#
# Run it by hand from the Actions tab. With dry_run it audits and says what it would have done, and opens nothing.
# A manual run audits the branch you pick; the weekly run always audits the default branch.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Audit and report, but do not open, edit or close the tracking issue
        type: boolean
        default: false

permissions: {}

concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Each audit may fail without stopping the others; the last step fails the run if any did.
      - id: govulncheck
        uses: ./.github/actions/audit-govulncheck
        continue-on-error: true

      - id: npm
        uses: ./.github/actions/audit-npm
        continue-on-error: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        continue-on-error: true
        with:
          context: .
          push: false
          load: true
          tags: kipple:audit
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ steps.version.outputs.vcs_ref }}

      - id: trivy
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/audit-image
        continue-on-error: true
        with:
          image-ref: kipple:audit

      # A check that did not run (the image did not build) is recorded as such and counts as a failure, never as clean.
      - name: Record outcomes
        if: ${{ !cancelled() }}
        env:
          GOVULNCHECK: ${{ steps.govulncheck.outcome }}
          NPM: ${{ steps.npm.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/audit-logs"
          echo "$GOVULNCHECK" > "$RUNNER_TEMP/audit-logs/govulncheck.status"
          echo "$NPM" > "$RUNNER_TEMP/audit-logs/npm.status"
          echo "$TRIVY" > "$RUNNER_TEMP/audit-logs/trivy.status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: audit-results
          path: ${{ runner.temp }}/audit-logs
          retention-days: 7

      - name: Fail if any audit failed
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ steps.govulncheck.outcome }} ${{ steps.npm.outcome }} ${{ steps.build.outcome }} ${{ steps.trivy.outcome }}
        run: |
          for o in $OUTCOMES; do
            if [ "$o" != success ]; then echo "an audit step ended as: $o"; exit 1; fi
          done

  # Separate job so the only token that can write issues never runs dependency code.
  report:
    needs: audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audit-results
          path: audit-results

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = true ]; then flag="--dry-run"; fi
          node scripts/audit-report.mjs --dir audit-results --run-url "$RUN_URL" $flag
