name: Scorecard

# OpenSSF Scorecard: supply-chain checks on the repository, published to the public Scorecard API
# (the README badge reads it). No secret is needed; results appear after the first run on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly, Mondays 05:17 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # publish_results: sign and publish to the Scorecard API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
