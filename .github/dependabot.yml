version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # The Go linters CI runs (staticcheck, gosec, govulncheck) and their dependencies.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Every require here is `// indirect` (they are `tool` directives), which Dependabot skips by default.
    allow:
      - dependency-type: "all"
    groups:
      go-tools:
        update-types: [major, minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint has no TS 7 support yet (tracked in typescript-eslint#10940); a TS 7 bump
      # breaks `npm run lint`. Revisit once that lands.
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
    commit-message:
      prefix: "chore(deps)"

  # The Dockerfile's base images are pinned as tag@sha256:digest; Dependabot updates the tag and
  # digest together, including digest-only rebuilds of the same tag. The gitleaks and Trivy images
  # in scripts/ci-local.ps1 are not covered: bump them with the versions in ci.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The Go version is driven by go.mod's toolchain line; the Dockerfile refuses a builder that differs
      # (scripts/toolchain.test.mjs checks the tag matches). A lone golang bump would fail that guard and hold
      # back the whole group, so bump the toolchain line and the tag together by hand.
      - dependency-name: "golang"
      # Node's odd-numbered releases (e.g. 23, 25) are never LTS; only even-numbered ones are, and
      # each becomes LTS in late October. Bump the major by hand once that happens, so CI keeps
      # testing the same Node version the image builds with (see .github/workflows/ci.yml).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
