name: Build the image
description: Build the Dockerfile for the runner's architecture into the local Docker daemon, with the version worked out from git. Expects a checkout with tags (fetch-depth 0).

inputs:
  tag:
    description: Local image tag to build.
    required: true
  cache-scope:
    description: GitHub Actions cache scope for the layer cache. Empty means no layer cache.
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # .git is excluded from the build context, so the version is worked out here and passed in.
    - name: Version
      id: version
      shell: bash
      run: |
        echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
        echo "vcs_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: ${{ inputs.tag }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          VCS_REF=${{ steps.version.outputs.vcs_ref }}
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
        # A throttled cache service must not fail the build.
        cache-to: ${{ inputs.cache-scope != '' && format('type=gha,scope={0},mode=max,ignore-error=true', inputs.cache-scope) || '' }}
