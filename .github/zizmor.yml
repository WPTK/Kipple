rules:
  # `uses: ./.github/workflows/ci.yml` (release.yml, line 88) is the local reusable-workflow form; the `$/` spelling
  # offers nothing here and is not worth changing in the release path.
  self-repository:
    ignore:
      - release.yml:88
      # The shared audits are local composite actions (`uses: ./.github/actions/audit-*`), the same local form. Whole
      # files rather than lines because ci.yml is edited often and a line number would go stale; neither file
      # references this repository any other way.
      - ci.yml
      - audit.yml
