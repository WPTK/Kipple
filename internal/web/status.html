<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kipple status</title>
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --bg:#fafaf7; --mut:#6b6b6b; --line:#dcdcd4; --bad:#b3261e; --ok:#2e7d32; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e3; --bg:#18181a; --mut:#9a9a94; --line:#333336; --bad:#ff8a80; --ok:#81c784; --warn:#e3b341; } }
  body { font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; max-width: 1100px; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 20px 0 6px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; }
  form, .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  input, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--mut); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wrap { overflow-x: auto; }
  .ok { color: var(--ok); } .failing, .dead { color: var(--bad); } .erroring, .throttled, .redirecting, .silent { color: var(--warn); } .archive, .disabled { color: var(--mut); }
  .warn { color: var(--warn); }
  .mut { color: var(--mut); }
  #log { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #err { color: var(--bad); min-height: 1.4em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Kipple</h1>
<div id="err"></div>

<section id="login" hidden>
  <form id="loginForm">
    <input name="username" placeholder="username" autocomplete="username" required>
    <input name="password" type="password" placeholder="password" autocomplete="current-password">
    <button>Sign in</button>
  </form>
</section>

<section id="app" hidden>
  <div class="bar">
    <button id="refresh">Refresh all</button>
    <a href="#" id="export"><button type="button">Export OPML</button></a>
    <label><button type="button" id="importBtn">Import OPML</button><input id="importFile" type="file" accept=".opml,.xml,text/xml" hidden></label>
    <span id="summary" class="mut"></span>
    <span style="flex:1"></span>
    <span id="conn" class="mut">events: connecting</span>
    <button id="logout">Sign out</button>
  </div>

  <h2>Runs</h2>
  <div id="runs" class="mut">idle</div>

  <h2>Feeds</h2>
  <div class="wrap">
    <table>
      <thead><tr><th>Feed</th><th>Status</th><th>Last fetch</th><th>Last success</th><th>Failures</th><th>Next</th><th>Notes</th></tr></thead>
      <tbody id="feeds"></tbody>
    </table>
  </div>

  <h2>Live events</h2>
  <div id="log"></div>
</section>

<script src="/_status.js"></script>
</body>
</html>
