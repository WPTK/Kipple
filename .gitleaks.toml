title = "kipple gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders, not real secrets"
paths = [
  '''^\.env\.example$''',
  '''^docker-compose\.example\.yml$''',
  '''^docs/.*\.md$''',
]

[[allowlists]]
description = "Test-only fixture secrets (testSecret) in Go test files; not real credentials"
paths = [
  '''^internal/api/api_test\.go$''',
  '''^internal/greader/harness_test\.go$''',
  '''^internal/backup/backup_test\.go$''',
  '''^cmd/kipple/restore_test\.go$''',
]
regexes = ['''(testSecret|secret64)\s*=''']

[[allowlists]]
description = "Character set used to generate random passwords, not a secret"
paths = ['''^internal/auth/auth\.go$''']
regexes = ['''passwordAlphabet\s*=''']
