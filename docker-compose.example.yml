# The build-from-source variant: it builds the image from this checkout, with resource limits and
# the full hardening. To pull the published image instead (from 0.5.0-beta.1), use
# docker-compose.pull.example.yml.
#
# Works standalone: copy this to docker-compose.yml (as README.md's Quickstart does), build and
# start it, open http://127.0.0.1:1919 and paste the setup code from `docker logs kipple`. No .env
# is needed: everything is set in the browser. If you're instead adding Kipple as one service
# inside a larger existing compose project, copy just this service block in and merge the
# top-level `volumes:` entry — see CLAUDE.md "Deploy" for that workflow specifically.
#
# Name the service explicitly when starting it: never a bare `docker compose up -d` / `down`
# against a compose file with other services in it.

services:
  kipple:
    build:
      context: .
      # Stamped into the binary (`kipple version`, the startup log, the fetch
      # User-Agent) and into the image labels.
      # .git is not in the build context, so pass them from the checkout:
      #   KIPPLE_VERSION=$(git describe --tags --always) KIPPLE_VCS_REF=$(git rev-parse HEAD) \
      #     docker compose build kipple
      # Unset, the build reports version "dev".
      args:
        VERSION: ${KIPPLE_VERSION:-dev}
        VCS_REF: ${KIPPLE_VCS_REF:-unknown}
        BUILD_DATE: ${KIPPLE_BUILD_DATE:-unknown}
    image: kipple:latest
    container_name: kipple
    # Come back after a crash or reboot, but stay down if you stopped it on purpose.
    restart: unless-stopped
    # The image's own HEALTHCHECK (kipple healthcheck) is used as is; see docs/deploy.md.
    # No /import mount on purpose: the nonroot user cannot read a bind-mounted
    # directory. Import an OPML with `kipple import -` and pipe the file in.
    # Optional: .env holds advanced overrides only (see .env.example). Compose 2.24 or newer
    # starts without the file; on an older Compose, create an empty .env or delete these lines.
    # If a .env from before 0.5 sets KIPPLE_ADDR=:7080, change the container side of the port
    # below to 7080 (or remove that line from .env).
    env_file:
      - path: .env
        required: false
    ports:
      # This machine only. Use "1919:1919" to reach Kipple from your LAN, or your Tailscale
      # address ("100.x.y.z:1919:1919"). See docs/deploy.md, "Open mode", before choosing
      # "no password" together with a wider bind.
      - "127.0.0.1:1919:1919"
    volumes:
      - kipple_data:/data
    # Kipple handles SIGTERM itself and finishes shutting down (HTTP drain, background
    # work, closing the DB) within 25 s, so no init process is needed. 30 s leaves margin.
    stop_grace_period: 30s
    # Hard memory cap; GOMEMLIMIT below makes the Go GC work harder before it is hit.
    mem_limit: 256m
    # Cap on processes/threads, so a runaway cannot fork-bomb the host.
    pids_limit: 200
    # Root filesystem is read-only. Kipple writes only under /data (a volume) and,
    # for scratch files, /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Drop every Linux capability; the app binds an unprivileged port (1919) as uid 65532.
    cap_drop:
      - ALL
    # Forbid gaining privileges through setuid binaries.
    security_opt:
      - no-new-privileges:true
    environment:
      - GOMEMLIMIT=64MiB
      # Address your reverse proxy / tunnel connects from (placeholder value;
      # see .env.example). Kipple logs a WARN if proxy headers arrive from any
      # other peer.
      # - KIPPLE_TRUSTED_PROXY_IPS=192.0.2.10
      # Optional Cloudflare Access token validation (set both or neither; see
      # .env.example and docs/deploy.md "Cloudflare Access (optional)"):
      # - KIPPLE_ACCESS_TEAM_DOMAIN=yourteam.cloudflareaccess.com
      # - KIPPLE_ACCESS_AUD=<application AUD tag>
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kipple_data:
